<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ENTRE NOUS : conseils simples et guides pratiques pour la vie de tous les jours. Au coeur de vos realites.">
<title>ENTRE NOUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Mise en page : en-tête fixe avec bande des six rubriques, page d'accueil en deux colonnes (texte + fleur des rubriques), contenus en colonne de lecture étroite. */
:root{
  --bg:#FCFAF7; --surface:#FFFFFF; --surface-2:#F3EFE8; --fg:#1D2A27; --muted:#56635E; --line:#E3DDD1;
  --brand:#17463F; --on-brand:#F4F8F6; --accent:#E3A02E; --accent-ink:#4A2F00; --focus:#1C6FD1;
  --c1:#D2553F; --c2:#1E8FA8; --c3:#C38A1A; --c4:#3C8D4F; --c5:#8C4A8E; --c6:#4B4BA8;
  --display:'Bricolage Grotesque','Nunito Sans',system-ui,sans-serif;
  --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1B19; --surface:#172622; --surface-2:#1D2F2A; --fg:#EDF2EF; --muted:#A5B4AE; --line:#2C403B;
    --brand:#8FD9C6; --on-brand:#0C2420; --accent:#F0B64A; --accent-ink:#2A1B00; --focus:#8AB8FF;
    --c1:#F0806B; --c2:#55C0D6; --c3:#E8B34A; --c4:#6CC27E; --c5:#C98BCB; --c6:#9A9AEA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1B19; --surface:#172622; --surface-2:#1D2F2A; --fg:#EDF2EF; --muted:#A5B4AE; --line:#2C403B;
  --brand:#8FD9C6; --on-brand:#0C2420; --accent:#F0B64A; --accent-ink:#2A1B00; --focus:#8AB8FF;
  --c1:#F0806B; --c2:#55C0D6; --c3:#E8B34A; --c4:#6CC27E; --c5:#C98BCB; --c6:#9A9AEA;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1.0625rem;line-height:1.65;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;letter-spacing:-.01em;margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--brand);color:var(--on-brand);padding:.6rem 1rem;z-index:100;border-radius:0 0 10px 0}
.skip:focus{left:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:70rem;margin:0 auto;min-width:0}
.sec{padding-block:clamp(2.2rem,5vw,3.8rem)}
.sec.alt{background:var(--surface-2)}
.muted{color:var(--muted)}
.eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.h2{font-size:clamp(1.55rem,3.6vw,2.15rem)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:.6rem 1.5rem;margin-bottom:1.5rem}
.sec-head p{max-width:38rem;color:var(--muted)}

/* En-tête */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr .in{display:flex;align-items:center;gap:.75rem;min-height:68px}
.stripe{height:4px;background:linear-gradient(90deg,var(--c1) 0 16.66%,var(--c2) 0 33.33%,var(--c3) 0 50%,var(--c4) 0 66.66%,var(--c5) 0 83.33%,var(--c6) 0 100%)}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--fg);margin-right:auto}
.logo svg{width:40px;height:26px;flex:none}
.logo .c-a{fill:none;stroke:var(--brand);stroke-width:3}
.logo .c-b{fill:none;stroke:var(--accent);stroke-width:3}
.logo b{font-family:var(--display);font-weight:800;letter-spacing:.07em;font-size:1.05rem;line-height:1}
.logo small{display:block;font-size:.7rem;font-weight:600;letter-spacing:.02em;color:var(--muted);margin-top:.2rem}
.nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem max(16px,env(safe-area-inset-left,0px)) 1rem;flex-direction:column}
.nav.open{display:flex}
.nav a{display:block;padding:.85rem .25rem;text-decoration:none;color:var(--fg);font-weight:700;border-bottom:1px solid var(--line)}
.nav a[aria-current="page"]{color:var(--brand);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px;text-decoration-color:var(--accent)}
.tools{display:flex;align-items:center;gap:.4rem}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{border-color:var(--brand)}
@media (min-width:1100px){
  .nav{display:flex;position:static;flex-direction:row;gap:.2rem;padding:0;border:0;background:none}
  .nav a{padding:.5rem .6rem;border:0;font-size:.93rem;border-radius:8px;white-space:nowrap}
  .menu-btn{display:none}
  .hdr .in{gap:1rem}
  .logo{margin-right:1rem}
  .hdr-mid{margin-right:auto}
}
.hdr-mid{display:contents}
@media (min-width:1100px){.hdr-mid{display:flex;align-items:center;margin-right:auto}.logo{margin-right:0}}

/* Boutons et pastilles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;padding:.6rem 1.25rem;border-radius:999px;font-weight:800;border:2px solid transparent;text-decoration:none;cursor:pointer;line-height:1.2;text-align:center}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border-color:var(--brand);color:var(--brand);background:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .8rem;border-radius:999px;font-size:.85rem;font-weight:700;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;color:var(--fg);min-height:36px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.tag{display:inline-block;padding:.15rem .65rem;border-radius:999px;font-size:.78rem;font-weight:800;background:color-mix(in srgb,var(--c,var(--brand)) 16%,var(--surface));color:color-mix(in srgb,var(--c,var(--brand)) 55%,var(--fg))}
.tag.soon{background:var(--surface-2);color:var(--muted)}

/* Accueil */
.hero{padding-block:clamp(1.8rem,5vw,3.6rem)}
.hero .wrap{display:grid;gap:2rem;align-items:center}
@media (min-width:900px){.hero .wrap{grid-template-columns:1.05fr .95fr}}
.hero h1{font-size:clamp(2.3rem,7vw,4rem);font-weight:800;letter-spacing:-.02em;margin:.5rem 0 1rem}
.hero .lead{font-size:1.15rem;max-width:34rem;color:var(--muted)}
.searchf{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.5rem;max-width:36rem}
.searchf input{flex:1 1 14rem;min-width:0;min-height:50px;padding:.6rem 1.1rem;border-radius:999px;border:2px solid var(--line);background:var(--surface)}
.searchf input:focus{border-color:var(--brand);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem;align-items:center}
.chips .lab{font-size:.85rem;color:var(--muted);font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;margin-top:1.4rem;font-size:.92rem;font-weight:700;color:var(--muted);padding:0;list-style:none}
.badges li::before{content:"";display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:var(--accent);margin-right:.45rem}
.flower{width:100%;max-width:27rem;height:auto;justify-self:center;display:block}
.flower circle.pet{fill-opacity:.34;stroke-width:2;transition:fill-opacity .2s}
.flower a:hover circle.pet,.flower a:focus-visible circle.pet{fill-opacity:.55}
.flower text{font-family:var(--display);font-weight:700;font-size:15px;fill:var(--fg);pointer-events:none}
.flower .hub{fill:var(--accent)}
.flower .hubt{font-size:10.5px;letter-spacing:.08em;fill:var(--accent-ink);font-weight:800}

/* Grilles et cartes */
.grid{display:grid;gap:1rem}
.g2,.g3,.g4{grid-template-columns:1fr}
@media (min-width:640px){.g2,.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:980px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.25rem;display:flex;flex-direction:column;gap:.6rem;min-width:0;text-decoration:none;color:var(--fg)}
a.card:hover{border-color:var(--c,var(--brand));transform:translateY(-2px)}
a.card{transition:transform .15s,border-color .15s}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:color-mix(in srgb,var(--c) 60%,var(--fg))}
.ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:1.2rem}
.card p{color:var(--muted);font-size:.97rem}
.card ul{margin:.2rem 0 0;padding-left:1.1rem;font-size:.93rem;color:var(--fg)}
.card .foot{margin-top:auto;padding-top:.5rem;font-weight:800;font-size:.9rem;color:var(--brand)}
.gcard h3{font-size:1.08rem;line-height:1.25}
.gcard p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:.82rem;color:var(--muted);font-weight:600;margin-top:auto;padding-top:.4rem}
.pr h3{font-size:1.1rem;margin-bottom:.3rem}
.pr p{color:var(--muted);font-size:.97rem}
.cta{background:var(--brand);color:var(--on-brand);border-radius:24px;padding:clamp(1.5rem,4vw,2.5rem);display:grid;gap:1.2rem}
@media (min-width:800px){.cta{grid-template-columns:1fr 1fr}}
.cta h2{font-size:clamp(1.4rem,3vw,1.9rem)}
.cta p{opacity:.92}
.cta .btn-primary{background:var(--accent);color:var(--accent-ink)}
.cta .btn-ghost{border-color:currentColor;color:var(--on-brand)}
.cta .btn-ghost:hover{background:rgba(255,255,255,.12)}
.cta .box{display:flex;flex-direction:column;gap:.7rem;align-items:flex-start}

/* Pages intérieures */
.pagehead{padding-block:clamp(1.8rem,4vw,3rem);background:color-mix(in srgb,var(--c,var(--accent)) 13%,var(--bg))}
.pagehead h1{font-size:clamp(1.9rem,5vw,3rem);margin:.4rem 0 .7rem}
.pagehead p{max-width:40rem;color:var(--muted);font-size:1.08rem}
.crumbs{font-size:.88rem;font-weight:700;color:var(--muted)}
.crumbs a{color:inherit}
.rubpanel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1.3rem;display:grid;gap:1rem;min-width:0}
@media (min-width:800px){.rubpanel{grid-template-columns:18rem 1fr;gap:1.8rem}}
.rubpanel h3{font-size:1.3rem;margin:.7rem 0 .4rem}
.subs{display:grid;gap:.5rem}
@media (min-width:560px){.subs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sub{display:flex;flex-direction:column;gap:.15rem;padding:.7rem .9rem;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-decoration:none;color:var(--fg);min-width:0}
.sub b{font-weight:700;font-size:.97rem}
.sub span{font-size:.82rem;font-weight:700}
.sub.has{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.sub.has span{color:color-mix(in srgb,var(--c) 60%,var(--fg))}
.sub.has:hover{background:color-mix(in srgb,var(--c) 10%,var(--bg))}
.sub.soon span{color:var(--muted);font-weight:600}
.sub.soon{opacity:.85}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.3rem}
.empty{padding:1.5rem;border:2px dashed var(--line);border-radius:16px;color:var(--muted)}
.incl{list-style:none;margin:.4rem 0 0!important;padding:0!important;display:grid;gap:.45rem}
.incl a{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.3rem .6rem;min-height:44px;padding:.5rem .75rem;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-decoration:none;color:var(--fg);font-size:.92rem;font-weight:600;line-height:1.35}
.incl a:hover{border-color:var(--brand)}
.incl a span:first-child{flex:1 1 12rem;min-width:0}
.incl-card h3{font-size:1.15rem}

/* Rubriques : présentation compacte et dépliable */
.rub-list{display:grid;gap:.8rem;max-width:62rem;margin:auto}
.rub-fold{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.rub-fold summary{display:flex;align-items:center;gap:1rem;padding:1rem 1.2rem;cursor:pointer;list-style:none;min-height:82px}
.rub-fold summary::-webkit-details-marker{display:none}
.rub-fold summary:hover{background:var(--surface-2)}
.rub-fold-name{display:flex;flex-direction:column;flex:1;min-width:0;gap:.15rem}
.rub-fold-name strong{font-family:var(--display);font-size:1.12rem;line-height:1.25}
.rub-fold-name small{color:var(--muted);font-size:.87rem;line-height:1.35}
.rub-fold-arrow{font-size:1.65rem;color:var(--muted);transition:transform .2s}
.rub-fold[open] .rub-fold-arrow{transform:rotate(180deg)}
.rub-fold-body{padding:0 1.2rem 1.2rem;border-top:1px solid var(--line)}
.rub-fold-body .subs{padding-top:1rem}
.rub-fold-foot{margin-top:1rem}
@media(max-width:520px){.rub-fold summary{gap:.7rem;padding:.85rem}.rub-fold-name small{font-size:.8rem}.rub-fold-body{padding:0 .85rem .85rem}}

/* Guide */
.art{max-width:44rem;min-width:0}
.art .lead{font-size:1.2rem;color:var(--muted);margin:.9rem 0 1.2rem}
.art h2{font-size:1.45rem;margin:2.2rem 0 .8rem}
.audio{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem;padding:.8rem 1rem;border:1px dashed var(--line);border-radius:14px;background:var(--surface)}
.audio .t{flex:1 1 12rem;font-size:.92rem;color:var(--muted)}
.audio .t b{color:var(--fg);display:block}
.steps{list-style:none;counter-reset:s;padding:0;margin:0;display:grid;gap:1rem}
.steps li{counter-increment:s;display:grid;grid-template-columns:2.4rem 1fr;gap:.85rem;align-items:start}
.steps li::before{content:counter(s);width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:color-mix(in srgb,var(--c) 65%,var(--fg))}
.steps b{display:block;font-size:1.05rem}
.steps span{color:var(--muted)}
.story{background:var(--surface-2);border-radius:18px;padding:1.25rem 1.3rem}
.story .lab{font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;display:block}
.story small{display:block;margin-top:.7rem;color:var(--muted);font-size:.85rem}
.keep{background:color-mix(in srgb,var(--c) 11%,var(--surface));border-radius:18px;padding:1.2rem 1.4rem}
.keep ul{margin:.6rem 0 0;padding-left:1.2rem;display:grid;gap:.4rem}
.keep li::marker{color:var(--c)}
.help{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:1.1rem 1.3rem;margin-top:1rem}
.help b{display:block;margin-bottom:.3rem}
.disc{margin-top:2rem;font-size:.88rem;color:var(--muted)}

/* Texte, formulaires */
.prose{max-width:46rem}
.prose h2{font-size:1.4rem;margin:2rem 0 .6rem}
.prose h3{font-size:1.1rem;margin:1.4rem 0 .4rem}
.prose p,.prose ul{margin-bottom:.9rem}
.prose ul{padding-left:1.2rem;display:grid;gap:.35rem}
.note{padding:.9rem 1.1rem;border-radius:14px;background:color-mix(in srgb,var(--accent) 22%,var(--surface));color:var(--fg);font-size:.95rem;margin-bottom:1.2rem}
.form{display:grid;gap:1rem;max-width:34rem}
.form label{font-weight:800;font-size:.95rem;display:block;margin-bottom:.3rem}
.form input,.form select,.form textarea{width:100%;min-height:48px;padding:.6rem .9rem;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.form textarea{min-height:9rem;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--brand);outline-offset:1px}
.mailbox{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;padding:.8rem 1rem;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.mailbox code{font-size:1rem;font-weight:700;user-select:all;word-break:break-all}
.cols{display:grid;gap:2rem}
@media (min-width:900px){.cols{grid-template-columns:1.1fr .9fr}}
.status{padding:.8rem 1rem;border-radius:12px;background:color-mix(in srgb,var(--c4) 18%,var(--surface));font-weight:700}

/* Pied de page */
.ftr{background:var(--surface-2);border-top:1px solid var(--line);padding-block:2.4rem 2rem}
.ftr .wrap{display:grid;gap:1.8rem}
@media (min-width:800px){.ftr .wrap{grid-template-columns:1.4fr 1fr 1.2fr 1fr}}
.ftr h4{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem;font-family:var(--body);font-weight:800}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:.15rem}
.ftr a{color:var(--fg);text-decoration:none;display:inline-block;padding:.25rem 0}
.ftr a:hover{text-decoration:underline}
.ftr .small{font-size:.85rem;color:var(--muted);margin-top:.8rem}
#app:focus{outline:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.guide-toolbar{margin-bottom:1.4rem;max-width:700px}.guide-search-label{display:block;font-weight:700;margin-bottom:.55rem}.guide-toolbar input{width:100%;min-height:50px;padding:.75rem 1rem;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);font:inherit}.guide-toolbar input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}.guide-toolbar .muted{margin:.65rem 0 0}.guide-count{font-weight:700;margin:0 0 1rem}.guide-empty{padding:2rem;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
</style>
</head>
<body>

<a class="skip" href="#contenu">Aller au contenu</a>
<header class="hdr">
  <div class="pad"><div class="wrap in">
    <div class="hdr-mid">
      <a class="logo" href="#accueil" aria-label="ENTRE NOUS, accueil">
        <svg viewBox="0 0 40 26" aria-hidden="true"><circle class="c-a" cx="13" cy="13" r="10.5"/><circle class="c-b" cx="27" cy="13" r="10.5"/></svg>
        <span><b>ENTRE NOUS</b><small>Au cœur de vos réalités</small></span>
      </a>
    </div>
    <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
    <div class="tools">
      <button class="ib" id="smaller" type="button" aria-label="Réduire la taille du texte"><span aria-hidden="true">A−</span></button>
      <button class="ib" id="bigger" type="button" aria-label="Agrandir la taille du texte"><span aria-hidden="true">A+</span></button>
      <a class="ib" href="#recherche" aria-label="Rechercher un conseil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></a>
      <button class="ib menu-btn" id="menu" type="button" aria-expanded="false" aria-controls="nav" aria-label="Ouvrir le menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div></div>
  <div class="stripe" aria-hidden="true"></div>
</header>
<main id="app" tabindex="-1"></main>
<footer class="ftr pad" id="footer"></footer>

<script>
(function(){
"use strict";

{id:"fam-1",sub:"1.1",min:4,
 title:"Parler sans se disputer : 5 gestes pour mieux se comprendre",
 lead:"Beaucoup de disputes ne viennent pas du fond du problème, mais de la façon dont la discussion commence. Quelques gestes simples changent le ton.",
 tags:["couple","dispute","dialogue","communication","mari","épouse","mariage"],
 comprendre:"Quand on est fatigué ou blessé, on parle vite et on écoute mal. Chacun se défend, personne n'entend l'autre. Le but n'est pas d'avoir raison, mais de se comprendre assez pour trouver une solution ensemble.",
 steps:[["Choisissez le bon moment","Évitez de parler au retour du travail, devant les enfants ou quand l'un de vous est en colère ou a faim. Proposez : « On peut en parler ce soir, après le repas ? »"],
  ["Commencez par « je »","Dites « Je me sens seule quand tu rentres tard sans prévenir » plutôt que « Tu ne penses jamais à moi »."],
  ["Un sujet à la fois","Ne ressortez pas les vieilles histoires. Gardez le sujet du jour."],
  ["Écoutez jusqu'au bout","Laissez l'autre finir sa phrase. Redites avec vos mots ce que vous avez compris : « Si je comprends bien, tu es inquiet parce que… »"],
  ["Terminez par un petit accord","Choisissez une chose concrète que chacun fera cette semaine. Remerciez l'autre d'avoir parlé."]],
 story:"Aminata et Ibrahima se disputaient chaque fin de mois à propos des dépenses. Un soir, Aminata a dit : « Je suis inquiète quand je ne sais pas combien il reste pour la cantine des enfants. » Ibrahima, qui s'attendait à un reproche, a écouté. Ils ont décidé de faire un point de dix minutes le premier dimanche de chaque mois.",
 retenir:["Le bon moment compte autant que les bons mots.","Parler de ce que l'on ressent évite d'accuser.","Un petit engagement concret vaut mieux qu'une grande promesse."],
 aide:"Si les disputes deviennent violentes ou si l'un de vous a peur de l'autre, ne restez pas seul(e). Parlez à une personne de confiance, à un service d'aide aux victimes ou à une association de votre pays."},

{id:"fam-2",sub:"1.4",min:4,
 title:"Prendre soin de ses parents âgés sans s'épuiser",
 lead:"Accompagner un père ou une mère qui vieillit est un devoir pour beaucoup de familles. C'est aussi une fatigue qui s'installe quand une seule personne porte tout.",
 tags:["parents","vieillesse","aînés","fatigue","partage","famille","grands-parents"],
 comprendre:"Dans beaucoup de familles, un seul enfant, souvent une fille, finit par tout assumer. Au début, on le fait par amour. Avec le temps, la fatigue et parfois la rancœur s'installent. Partager les tâches protège la santé de tous, y compris celle de votre parent. Si un aîné de votre entourage vit seul, des visites régulières et un appel chaque semaine peuvent déjà beaucoup compter pour lui.",
 steps:[["Faites la liste des besoins","Repas, médicaments, rendez-vous, toilette, compagnie, argent. Voir tout sur le papier aide à se répartir le travail."],
  ["Réunissez la famille","Invitez frères, sœurs, oncles et tantes, même ceux qui vivent loin. Chacun peut aider autrement : du temps, de l'argent, des appels, un déplacement."],
  ["Répartissez par écrit","Un cahier ou un groupe WhatsApp : qui fait quoi, quel jour. Revoyez ce partage chaque mois."],
  ["Gardez du temps pour vous","Prévoyez un moment par semaine pour vous reposer. Ce n'est pas de l'égoïsme, c'est ce qui permet de tenir."],
  ["Écoutez votre parent","Demandez-lui ce qu'il préfère. Même âgé, il garde le droit de donner son avis sur sa propre vie."]],
 story:"Mariam s'occupait seule de sa mère. Après une grande fatigue, elle a réuni ses quatre frères et sœurs. Celui qui vit à l'étranger envoie de quoi payer les médicaments, la sœur aînée passe le mercredi, le plus jeune accompagne aux rendez-vous. Mariam prépare toujours les repas, mais elle n'est plus seule.",
 retenir:["Prendre soin ne veut pas dire tout faire seul.","Chacun peut aider à sa façon.","Écrire qui fait quoi évite les malentendus."],
 aide:"Si votre parent a des pertes de mémoire, des chutes répétées ou des douleurs qui ne passent pas, parlez-en à un agent de santé ou à un médecin."},

{id:"edu-1",sub:"2.2",min:5,
 title:"Parler avec un adolescent qui se ferme",
 lead:"À l'adolescence, beaucoup de jeunes répondent par des silences ou des « ça va ». Cela ne veut pas dire qu'ils n'ont plus besoin de vous.",
 tags:["adolescent","ado","enfant","silence","dialogue","parents","jeune","écoute"],
 comprendre:"Un adolescent cherche à devenir autonome. Il se compare, il doute, il a peur d'être jugé. S'il se tait, c'est souvent qu'il craint une punition ou un sermon. Pour qu'il reparle, il doit sentir que la discussion est sans danger.",
 steps:[["Parlez en faisant autre chose","Marcher ensemble, cuisiner, aller au marché. Face à face, la conversation ressemble vite à un interrogatoire."],
  ["Posez des questions ouvertes","Au lieu de « Ça s'est bien passé ? », essayez « Qu'est-ce qui t'a surpris aujourd'hui ? »"],
  ["Écoutez avant de corriger","Quand il raconte quelque chose de difficile, remerciez-le d'avoir parlé avant de donner votre avis."],
  ["Fixez peu de règles, mais claires","Heures de retour, téléphone, tâches à la maison. Expliquez pourquoi, et écoutez ses propositions."],
  ["Montrez l'exemple","Un adulte qui crie peut difficilement demander le calme. Dites aussi « pardon » quand vous vous trompez."]],
 story:"Kwame, 15 ans, ne parlait presque plus à son père. Celui-ci a commencé à l'emmener au champ le samedi. Au bout de trois semaines, sans question directe, Kwame a avoué qu'il avait peur de redoubler. Son père a répondu : « Merci de me le dire. Voyons ensemble comment t'aider. »",
 retenir:["Le silence n'est pas un rejet.","Le ton compte plus que le discours.","Un adolescent qui se sent écouté revient vers vous."],
 aide:"Si votre enfant semble très triste pendant plusieurs semaines, s'isole beaucoup ou parle de se faire du mal, parlez-en rapidement à un professionnel de santé, à un enseignant de confiance ou à un service d'écoute de votre pays."},

{id:"edu-2",sub:"2.3",min:4,
 title:"Choisir son orientation : 4 questions à se poser",
 lead:"Choisir une filière ou un métier à 15 ou 18 ans fait peur. Quelques questions simples aident à y voir plus clair.",
 tags:["orientation","filière","études","métier","lycée","université","avenir","choix"],
 comprendre:"On choisit souvent selon l'avis des parents, des amis ou le prestige d'un métier. Ces avis comptent, mais ils ne disent pas tout. Un bon choix tient compte de vos goûts, de vos points forts, des débouchés réels et de vos moyens.",
 steps:[["Qu'est-ce que j'aime faire ?","Pensez à ce que vous faites avec plaisir, même sans être payé : réparer, expliquer, soigner, vendre, dessiner, organiser."],
  ["Où est-ce que je réussis ?","Regardez vos notes, mais aussi ce que les autres vous demandent souvent de faire pour eux."],
  ["Quels métiers recrutent autour de moi ?","Rencontrez des personnes qui exercent. Demandez comment elles ont commencé, ce qu'elles font dans la journée, combien de temps ont duré leurs études."],
  ["Quel chemin est possible pour moi ?","Durée, coût, distance, bourses, formations courtes. Il existe souvent plusieurs routes vers un même métier."]],
 story:"Fatou rêvait d'être médecin, mais ses notes en sciences étaient moyennes et sa famille ne pouvait pas financer de longues études. Elle a rencontré une infirmière et une sage-femme de son quartier. Elle s'oriente vers une formation en soins infirmiers, avec la possibilité de poursuivre plus tard.",
 retenir:["Un premier choix n'est pas définitif.","Parler à des personnes qui exercent le métier aide plus que rêver.","Plusieurs chemins mènent souvent au même but."],
 aide:"Demandez conseil à un conseiller d'orientation, à un enseignant ou au centre d'information de votre ville."},

{id:"trav-1",sub:"3.2",min:4,
 title:"Écrire un CV simple qui se fait remarquer",
 lead:"Un bon CV tient sur une page, se lit en trente secondes et dit clairement ce que vous savez faire.",
 tags:["cv","emploi","travail","candidature","embauche","curriculum","entretien"],
 comprendre:"La personne qui lit votre CV en reçoit souvent beaucoup. Elle cherche vite : qui êtes-vous, que savez-vous faire, comment vous joindre. Un CV court, propre et sincère vaut mieux qu'un long document décoré.",
 steps:[["Écrivez vos coordonnées en haut","Nom, téléphone, adresse e-mail, ville. Choisissez une adresse e-mail sérieuse, avec votre nom."],
  ["Ajoutez une phrase de présentation","Par exemple : « Couturière avec cinq ans d'expérience, rapide et soigneuse, je cherche un poste en atelier. »"],
  ["Listez vos expériences","Du plus récent au plus ancien : lieu, dates, ce que vous faisiez. Pensez aussi aux petits travaux, au bénévolat et aux activités de quartier."],
  ["Indiquez formations et compétences","Diplômes, stages, langues parlées, outils maîtrisés (téléphone, tableur, machine, conduite)."],
  ["Relisez et faites relire","Une faute d'orthographe fait mauvaise impression. Demandez à une personne de confiance de relire, puis enregistrez le CV en PDF."]],

 retenir:["Une page suffit.","Soyez précis et honnête.","Les petits travaux comptent aussi comme expérience."],
 aide:""},

{id:"trav-2",sub:"3.3",min:5,
 title:"Lancer une petite activité avec peu de moyens",
 lead:"On peut commencer petit, tester, apprendre, puis grandir. Voici comment éviter les erreurs les plus fréquentes.",
 tags:["activité","commerce","entreprise","projet","vendre","prix","bénéfice","petit commerce","entreprendre"],
 comprendre:"Beaucoup de projets s'arrêtent parce qu'on commence trop grand, qu'on mélange l'argent de la famille et celui de l'activité, ou qu'on ne sait pas qui sont les clients. Commencer petit permet d'apprendre sans trop risquer.",
 steps:[["Choisissez un besoin réel","Que demandent souvent les gens autour de vous ? Que paient-ils déjà ailleurs ?"],
  ["Testez avec peu","Vendez une petite quantité pendant deux semaines. Notez ce qui part vite et ce qui reste."],
  ["Calculez votre prix","Additionnez ce que vous avez dépensé (achats, transport, eau, électricité, votre temps), puis ajoutez un petit bénéfice."],
  ["Séparez les comptes","Un cahier dédié : ce qui entre, ce qui sort. Ne mélangez pas avec l'argent de la maison."],
  ["Faites grandir doucement","Réinvestissez une partie du bénéfice. Demandez l'avis de vos clients."]],
 story:"Mariam vendait des beignets devant chez elle. Elle a noté ses dépenses pendant deux semaines et a vu qu'elle vendait à perte à cause du prix de l'huile. En changeant le prix et la taille des beignets, elle a dégagé un petit bénéfice chaque jour.",
 retenir:["Commencez petit.","Notez tout ce qui entre et tout ce qui sort.","Écoutez vos clients."],
 aide:"Renseignez-vous auprès des structures d'appui aux petites entreprises de votre ville ou de votre pays."},

 {id:"trav-3",sub:"3.6",min:5,
  title:"Piston et favoritisme au travail : comment préserver le respect et l’équité ?",
  lead:"Une recommandation peut ouvrir la porte d’un emploi. Mais les liens avec la direction ne donnent pas le droit de mépriser les collègues, d’éviter les règles ou de perturber le travail des autres.",
  tags:["bras long","piston","favoritisme","patron","recommandation","emploi","respect","collègues","injustice","professionnalisme"],
  comprendre:"Dans certaines entreprises, une personne est recrutée grâce à un parent, une connaissance ou une recommandation. D’autres candidats ont suivi un entretien et un processus de sélection. Ces parcours différents ne devraient pas déterminer la valeur d’un employé : chacun doit être jugé sur son travail et son comportement. Les tensions apparaissent lorsqu’une personne se croit intouchable, dit « le patron est de ma famille », refuse les consignes ou bénéficie de privilèges injustifiés. Cela peut décourager l’équipe et fragiliser la confiance.",
  steps:[["Respectez les règles communes","Que vous ayez été recommandé ou recruté après un entretien, respectez les horaires, les consignes et les responsabilités de votre poste."],
   ["Ne confondez pas relations personnelles et autorité professionnelle","Connaître le responsable ne donne pas le droit d’humilier un collègue, de refuser une tâche ou d’imposer ses décisions."],
   ["Évaluez les faits plutôt que les rumeurs","Si une situation vous semble injuste, notez des exemples précis : consignes non respectées, tâches reportées sur d’autres, traitement différent."],
   ["Parlez calmement des conséquences sur le travail","Expliquez à votre responsable ce qui perturbe l’équipe, sans attaquer la vie privée ni les relations familiales d’un collègue."],
   ["Demandez des règles transparentes","Une répartition claire des tâches, des critères d’évaluation identiques et un traitement cohérent des manquements protègent tous les employés."],
   ["Utilisez les voies de recours adaptées","Si le problème persiste, renseignez-vous sur les procédures internes, les représentants du personnel ou les services compétents de votre pays. Évitez les accusations publiques non vérifiées."]],
  story:"Dans une petite entreprise, Abdou est arrivé grâce à une connaissance du directeur. Il répétait souvent : « Le patron est mon parent », et laissait ses collègues terminer ses tâches. Aïcha, recrutée après un entretien, se sentait lésée. Au lieu de lancer une dispute, elle a relevé plusieurs retards dans la répartition du travail et en a parlé au responsable. Celui-ci a clarifié les missions et rappelé que les mêmes règles s’appliquaient à tous. Cette histoire est fictive.",
  retenir:["Une recommandation n’excuse pas le manque de professionnalisme.","Le respect et les règles doivent être les mêmes pour tous.","Pour signaler une injustice, mieux vaut s’appuyer sur des faits précis plutôt que sur des suppositions."],
  aide:"Si vous subissez des menaces, du harcèlement ou des représailles, cherchez un soutien fiable auprès d’un représentant du personnel, d’un service de ressources humaines ou d’un organisme compétent dans votre pays. Les droits et les procédures varient selon les lieux."},

{id:"bien-1",sub:"4.1",min:3,
 title:"Retrouver le calme en cinq minutes",
 lead:"Quand tout s'accumule, le corps se crispe et les pensées s'emballent. Ces gestes simples aident à redescendre.",
 tags:["stress","calme","anxiété","respiration","inquiétude","fatigue","nerfs","angoisse"],
 comprendre:"Le stress est une réaction normale face à une difficulté. Il devient pénible quand il dure, que le sommeil se dégrade ou que l'on n'arrive plus à se concentrer. On ne peut pas toujours changer la situation, mais on peut apaiser le corps.",
 steps:[["Posez-vous","Asseyez-vous, les pieds au sol, les épaules relâchées."],
  ["Respirez lentement","Inspirez par le nez en comptant jusqu'à quatre, expirez doucement par la bouche en comptant jusqu'à six. Recommencez cinq à dix fois."],
  ["Nommez ce qui vous pèse","Dites ou écrivez en une phrase : « Je suis inquiet pour… »"],
  ["Choisissez une seule action","Quelle est la plus petite chose que vous pouvez faire aujourd'hui ?"],
  ["Parlez ou bougez","Appelez une personne de confiance, ou marchez dix minutes."]],
 story:"Koffi avait des factures en retard et ne dormait plus. Chaque soir, il a pris cinq minutes pour respirer, puis il a écrit la liste de ses dettes. Voir les chiffres sur le papier l'a calmé. Il a ensuite appelé la personne à qui il devait de l'argent pour proposer un paiement en plusieurs fois.",
 retenir:["Le calme commence par la respiration.","Une petite action vaut mieux qu'une grande inquiétude.","Parler à quelqu'un soulage."],

{id:"bien-2",sub:"4.4",min:5,

 steps:[["Laissez venir ce que vous ressentez","Pleurer, se taire, parler de la personne disparue : tout cela est permis."],
  ["Gardez des repères","Mangez, buvez, dormez autant que possible. Gardez une petite routine."],

  ["Remettez les grandes décisions à plus tard","Vendre, déménager, rompre des liens : attendez quand c'est possible."],
  ["Continuez à parler de votre proche","Racontez des souvenirs, regardez des photos, honorez sa mémoire à votre manière."]],

{id:"arg-1",sub:"5.1",min:5,

{id:"arg-2",sub:"5.4",min:4,

{id:"soc-1",sub:"6.5",min:4,

/* Recherche */
function wd(x){return " "+norm(x).replace(/[^a-z0-9]+/g," ")}
function has(h,t){return h.indexOf(" "+t)>-1}
function search(q){
  var toks=norm(q).split(/\s+/).map(function(t){return t.length>3?t.replace(/s$/,""):t}).filter(function(t){return t.length>=2});
  if(!toks.length) return null;
  var ss=[], viaSub={};
  R.forEach(function(r,i){r.subs.forEach(function(x){
    var nn=wd(x.n+" "+x.k+" "+r.name);
    if(toks.every(function(t){return has(nn,t)})){
      var gl=guidesOf(x.c);
      if(gl.length){gl.forEach(function(g){viaSub[g.id]=1})}else{ss.push({r:i,n:x.n})}
    }
  })});
  var gs=[];
  G.forEach(function(g){
    var fs=findSub(g.sub);
    var f={t:wd(g.title),tags:wd(g.tags.join(" ")),sub:wd(fs?fs.s.n+" "+fs.s.k:""),r:wd(R[g.r].name),b:wd([g.lead,g.comprendre,g.story,g.retenir.join(" "),g.steps.map(function(s){return s[0]+" "+s[1]}).join(" ")].join(" "))};
    var sc=0, ok=true;
    for(var k=0;k<toks.length;k++){
      var t=toks[k],v=0;
      if(has(f.t,t))v+=5; if(has(f.tags,t))v+=4; if(has(f.sub,t))v+=3; if(has(f.r,t))v+=2; if(has(f.b,t))v+=1;
      if(!v){ok=false;break}
      sc+=v;
    }
    if(!ok&&viaSub[g.id]){ok=true;sc=1}
    else if(ok&&viaSub[g.id]){sc+=3}
    if(ok) gs.push({g:g,sc:sc});
  });
  gs.sort(function(a,b){return b.sc-a.sc});
  return {g:gs.map(function(x){return x.g}),s:ss};
}

   '<div><h4>Explorer</h4><ul>'+NAV.map(function(n){return '<li><a href="#'+n[0]+'">'+n[1]+'</a></li>'}).join('')+'</ul></div>'+
   '<div><h4>Rubriques</h4><ul>'+R.map(function(r){return '<li><a href="#rubrique-'+r.slug+'">'+esc(r.name)+'</a></li>'}).join('')+'</ul></div>'+
   '<div><h4>Informations</h4><ul><li><a href="#mentions">Mentions légales et confidentialité</a></li><li><a href="#contact">Contact</a></li></ul></div></div>';
}
function show(route,force){
  if(!force&&route===current) return;
  current=route;
  app.innerHTML=render(route);
  var sec_=section(route);
  var links=document.querySelectorAll("[data-nav]");
  for(var i=0;i<links.length;i++){ if(links[i].getAttribute("data-nav")===sec_) links[i].setAttribute("aria-current","page"); else links[i].removeAttribute("aria-current"); }
  $("#nav").classList.remove("open"); $("#menu").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
  if(route==="recherche"){var q=$("#q"); if(q) q.focus();}
}
function route(){var h=(location.hash||"").replace(/^#/,""); return h||"accueil"}
function go(r){
  try{history.pushState(null,"","#"+r)}catch(e){try{location.hash=r}catch(_){}}
  show(r);
}

/* ================= ÉVÉNEMENTS ================= */

document.addEventListener("click",function(e){
  var a=e.target.closest&&e.target.closest('a[href^="#"]');
  if(a){
    var h=a.getAttribute("href").slice(1);
    e.preventDefault();
    if(h==="contenu"){app.focus();return}
    go(h);return;
  }
  var q=e.target.closest("[data-q]");
  if(q){state.q=q.getAttribute("data-q"); if(current==="recherche"){show("recherche",true)} else go("recherche"); return}
  var f=e.target.closest("[data-filter]");
  if(f){state.filter=f.getAttribute("data-filter"); var fl=document.querySelector(".filters"); if(fl)fl.innerHTML=filters(); var gl=$("#glist"); if(gl)gl.innerHTML=glist(); return}
  var c=e.target.closest("[data-copy]");
  if(c){
    var t=c.getAttribute("data-copy");
    var done=function(){c.textContent="Copié"; setTimeout(function(){c.textContent="Copier"},1800)};
    var sel=function(){var el=$("#mail"); if(el){var r=document.createRange(); r.selectNodeContents(el); var s=window.getSelection(); s.removeAllRanges(); s.addRange(r); c.textContent="Sélectionné"}};
    try{navigator.clipboard.writeText(t).then(done,sel)}catch(err){sel()}
  }
});
document.addEventListener("input",function(e){
  if(e.target&&e.target.id==="q"){state.q=e.target.value; var r=$("#results"); if(r) r.innerHTML=results()}
  if(e.target&&e.target.id==="guide-search"){state.guideQuery=e.target.value; var gl=$("#glist"); if(gl)gl.innerHTML=glist()}
});
document.addEventListener("submit",function(e){
  var f=e.target.getAttribute&&e.target.getAttribute("data-form");
  if(!f) return;
  e.preventDefault();
  if(f==="search"){state.q=($("#hq")||{}).value||""; go("recherche")}
  else if(f==="search2"){var i=$("#q"); if(i)i.blur()}
  else if(f==="contact"){
    var m=$("#c-msg"), s=$("#c-status");
    if(!m.value.trim()){s.textContent="Écrivez d'abord votre message."; m.focus(); return}
    s.textContent="Rien n'a été envoyé : ce formulaire est en démonstration. Utilisez l'adresse indiquée sur cette page.";
  }
});
$("#menu").addEventListener("click",function(){
  var n=$("#nav"), open=!n.classList.contains("open");
  n.classList.toggle("open",open); this.setAttribute("aria-expanded",String(open));
});
var sizes=[100,112,125], si=0;
try{var sv=parseInt(localStorage.getItem("en-size"),10); if(sv>=0&&sv<sizes.length) si=sv}catch(e){}
function applySize(){document.documentElement.style.fontSize=sizes[si]+"%"; try{localStorage.setItem("en-size",String(si))}catch(e){}}
$("#bigger").addEventListener("click",function(){if(si<sizes.length-1){si++;applySize()}});
$("#smaller").addEventListener("click",function(){if(si>0){si--;applySize()}});
window.addEventListener("hashchange",function(){show(route())});
window.addEventListener("popstate",function(){show(route())});

buildChrome(); applySize(); show(route(),true);
})();
</script>
</body>
</html>
